name: Aster Algo Scanner

on:
  schedule:
    # Default: every 10 minutes, offset from the top of the hour.
    # GitHub Actions minimum schedule interval is 5 minutes.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aster-algo-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python monitor.py --self-test

      - name: Scan markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          MIN_ASTER_SPREAD_PCT: '0.15'
          MIN_DEVIATION_PCT: '0.20'
          MIN_24H_MOVE_PCT: '8.0'
          MIN_ASTER_QUOTE_VOLUME_24H: '50000'
          MIN_REFERENCE_EXCHANGES: '2'
          MAX_REFERENCE_DISAGREEMENT_PCT: '0.20'

          SAMPLE_COUNT: '6'
          SAMPLE_INTERVAL_SECONDS: '4'
          MAX_CANDIDATES: '25'
          WATCH_SCORE: '55'
          HOT_SCORE: '72'
          HOT_MIN_DEVIATION_HIT_RATIO: '0.25'
          ALERT_LEVELS: 'WATCH,HOT'
          ALERT_COOLDOWN_MINUTES: '60'
        run: python monitor.py

      - name: Persist Telegram cooldown state
        shell: bash
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: update scanner alert state [skip ci]"
          git push
