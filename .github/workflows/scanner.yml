name: Perp Inefficiency Scanner V16.5

on:
  schedule:
    # GitHub cron работает в UTC.
    # Сканирование каждые 5 минут.
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perp-inefficiency-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"

      # Telegram
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Основной размер виртуальной сделки
      PAPER_PROBE_NOTIONAL_USD: "100"
      EXECUTION_MIN_NOTIONAL_USD: "100"

      # Сигнал только если fresh executable NET строго > 0.10%
      EXECUTION_MIN_NET_EDGE_PCT: "0.100001"
      ECONOMIC_MIN_NET_EDGE_PCT: "0.100001"
      PAPER_MIN_ENTRY_NET_EDGE_PCT: "0.100001"

      # Проверяем все экономически интересные кандидаты
      ECONOMIC_SIGNALS_ENABLED: "true"
      ECONOMIC_PROBE_MIN_GROSS_PCT: "0.0"
      ECONOMIC_PROBE_MAX_CANDIDATES: "1000"

      # Не ограничиваем paper simulation искусственным капиталом биржи:
      # хотим узнать результат, если бы входили во ВСЕ подходящие сигналы.
      PAPER_TRADING_ENABLED: "true"
      PAPER_ENFORCE_VENUE_CAPITAL: "false"

      # Telegram не должен дублировать старые ACTIVE-LAG / ACTIVE-MM алерты.
      ACTIVE_OUTCOME_ALERTS_ENABLED: "false"
      ACTIVE_LAG_HORIZON_ALERTS_ENABLED: "false"
      SCAN_SUMMARY_ENABLED: "false"

      # Один непрерывный сигнал не спамим каждые 5 минут.
      # Новый сигнал появится после исчезновения opportunity и нового crossing.
      ECONOMIC_SIGNAL_COOLDOWN_MINUTES: "0"

      # Daily paper report
      PAPER_REPORT_ENABLED: "true"
      PAPER_REPORT_SEND_TELEGRAM: "true"
      DAILY_REPORT_TZ: "Europe/Riga"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test
        run: |
          python monitor.py --self-test

      - name: Scan markets
        run: |
          python monitor.py

      - name: Commit updated scanner state
        if: always()
        run: |
          if [ ! -f state/state.json ]; then
            echo "state/state.json does not exist; nothing to commit."
            exit 0
          fi

          if git diff --quiet -- state/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/state.json
          git commit -m "Update scanner state [skip ci]"

          # На случай, если между checkout и push в main появился новый commit.
          git pull --rebase origin main
          git push origin HEAD:main
