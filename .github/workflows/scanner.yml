name: Aster Algo Scanner

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aster-algo-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test
        run: python monitor.py --self-test

      - name: Scan markets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ASTER_BASE_URL: 'https://fapi.asterdex.com'
          BYBIT_BASE_URL: 'https://api.bybit.com'
          BITGET_BASE_URL: 'https://api.bitget.com'
          MEXC_BASE_URL: 'https://api.mexc.com'

          # Stage 1: broad prefilter.
          MIN_ASTER_SPREAD_PCT: '0.15'
          MIN_DEVIATION_PCT: '0.20'
          MIN_EXECUTABLE_EDGE_PCT: '0.15'
          MIN_CURRENT_EXECUTABLE_EDGE_PCT: '0.15'

          MIN_24H_MOVE_PCT: '8.0'
          MIN_ASTER_QUOTE_VOLUME_24H: '50000'

          MIN_PERP_REFERENCE_EXCHANGES: '2'
          MAX_PERP_REFERENCE_DISAGREEMENT_PCT: '0.20'

          # Spot is diagnostic only.
          MIN_SPOT_REFERENCE_EXCHANGES: '2'
          MAX_SPOT_REFERENCE_DISAGREEMENT_PCT: '0.30'

          # Reject obviously incomparable same-symbol contracts / multipliers.
          # Example: Aster price 0.10 vs external PERP 0.0005 should never become
          # an 18,000% LAG alert.
          MAX_CROSS_VENUE_PRICE_RATIO: '2.0'

          MAX_CANDIDATES: '50'

          # Stage 2: initial confirmation for all shortlisted names.
          CONFIRM_DURATION_SECONDS: '45'
          CONFIRM_INTERVAL_SECONDS: '1.5'
          MAX_TRADE_ANALYSIS_CANDIDATES: '50'
          ASTER_TRADE_LIMIT: '500'
          TRADE_SAMPLE_MATCH_TOLERANCE_SECONDS: '3.0'

          # Stage 3 MM: extend only strongest initial MM candidates.
          EXTENDED_MM_ENABLED: 'true'
          EXTENDED_MM_MAX_CANDIDATES: '3'
          EXTENDED_MM_DURATION_SECONDS: '180'
          EXTENDED_MM_INTERVAL_SECONDS: '1.5'
          EXTENDED_MM_TRADES_POLL_SECONDS: '5'

          # MATURE-MM criteria.
          MATURE_MM_MIN_OBSERVED_SECONDS: '180'
          MATURE_MM_MIN_EXCURSIONS: '20'
          MATURE_MM_MIN_CLEAN_REVERSION_RATE: '0.70'
          MATURE_MM_MAX_MEDIAN_REVERSION_SECONDS: '5.0'
          MATURE_MM_MIN_EXCURSIONS_PER_MINUTE: '3.0'
          MATURE_MM_MAX_QUIET_SECONDS: '45'

          # Initial LAG economics.
          # SHORT: sell Aster bid, buy external median PERP ask.
          # LONG:  buy Aster ask, sell external median PERP bid.
          MIN_HEDGEABLE_EDGE_PCT: '0.20'
          MIN_CURRENT_HEDGEABLE_EDGE_PCT: '0.20'
          MIN_HEDGEABLE_EDGE_HIT_RATIO: '0.60'

          ESTIMATED_ROUNDTRIP_FEES_PCT: '0.20'
          MIN_NET_HEDGEABLE_EDGE_PCT: '0.05'

          MAX_LAG_MEDIAN_SPREAD_PCT: '0.60'
          MIN_ASTER_TRADES_FOR_LAG: '3'
          MIN_REF_GOOD_RATIO: '0.80'

          # V8: initial LAG is NOT sent immediately. The strongest candidates
          # are observed for another ~3 minutes and must actually converge.
          EXTENDED_LAG_ENABLED: 'true'
          EXTENDED_LAG_MAX_CANDIDATES: '3'
          EXTENDED_LAG_DURATION_SECONDS: '180'
          EXTENDED_LAG_INTERVAL_SECONDS: '1.5'

          # At least 50% of the initial same-side gap must disappear at least once.
          LAG_MIN_EXTENDED_OBSERVED_SECONDS: '120'
          LAG_MIN_CONVERGENCE_FRACTION: '0.50'
          LAG_MIN_CONVERGENCE_EVENTS: '1'

          # A gap <= 0.05% counts as a near/full convergence cycle.
          LAG_FULL_CONVERGENCE_EDGE_PCT: '0.05'

          # After a convergence, re-arm a new cycle only after the gap expands
          # back to at least 75% of the original detected gap.
          LAG_REEXPANSION_FRACTION: '0.75'

          # V8: cross-run structural-gap baseline stored in state/state.json.
          # With a 10-minute schedule, 60 minutes gives roughly 6 prior points.
          LAG_BASELINE_LOOKBACK_MINUTES: '60'
          LAG_BASELINE_MIN_POINTS: '3'
          LAG_BASELINE_MAX_POINTS: '12'

          # Once enough history exists, the newly detected gap must be materially
          # larger than its recent normal level. Required gap is the larger of:
          # baseline median + 0.10 percentage points, or baseline median * 1.25.
          LAG_BASELINE_MIN_EXCESS_PCT: '0.10'
          LAG_BASELINE_MIN_RATIO: '1.25'

          # --------------------------------------------------
          # V9 ACTIVE-LAG (signal only; NO orders)
          # --------------------------------------------------
          # A new active gap is reported only after the SAME symbol/side has
          # at least one prior verified CONVERGING-LAG episode in state history.
          ACTIVE_LAG_ENABLED: 'true'
          ACTIVE_LAG_MIN_GROSS_EDGE_PCT: '0.30'
          ACTIVE_LAG_MIN_NET_EDGE_PCT: '0.10'
          ACTIVE_LAG_MIN_HIT_RATIO: '0.60'
          ACTIVE_LAG_MAX_REFERENCE_DISAGREEMENT_PCT: '0.20'
          ACTIVE_LAG_MIN_VERIFIED_EPISODES: '1'
          ACTIVE_LAG_PROFILE_LOOKBACK_HOURS: '24'
          ACTIVE_LAG_PROFILE_MAX_POINTS: '50'

          # MM excursion/reversion rules.
          EXCURSION_THRESHOLD_PCT: '0.20'
          REVERSION_BAND_PCT: '0.08'
          MIN_EXCURSIONS: '3'
          MIN_CLEAN_REVERSION_RATE: '0.70'
          MAX_MEDIAN_REVERSION_SECONDS: '8.0'
          MAX_REFERENCE_MOVE_DURING_REVERSION_PCT: '0.12'
          MIN_ASTER_TRADES_FOR_MM: '6'

          # --------------------------------------------------
          # V9 ACTIVE-MM-EXCURSION (signal only; NO orders)
          # --------------------------------------------------
          # After Stage 2 confirms an MM regime, Stage 3 watches for NEW
          # excursions. Telegram batches them, but reports the exact event count.
          ACTIVE_MM_EXCURSION_ENABLED: 'true'
          ACTIVE_MM_MIN_EXCURSION_PCT: '0.30'
          ACTIVE_MM_MAX_REFERENCE_DISAGREEMENT_PCT: '0.20'
          ACTIVE_MM_MIN_PRIOR_EXCURSIONS: '3'
          ACTIVE_MM_MIN_CLEAN_REVERSION_RATE: '0.70'
          ACTIVE_MM_INITIAL_LOOKBACK_SECONDS: '10'
          ACTIVE_MM_ALERT_BATCH_SECONDS: '30'

          # WATCH stays disabled.
          CONFIRMED_SCORE: '70'
          ALERT_LEVELS: 'CONFIRMED'
          ALERT_COOLDOWN_MINUTES: '60'

          # Telegram charts.
          CHART_ALERT_LEVELS: 'CONFIRMED'
          CHARTS_DIR: 'charts'

        run: python monitor.py

      - name: Persist scanner state
        shell: bash
        run: |
          if git diff --quiet -- state/state.json; then
            echo "No state change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/state.json
          git commit -m "chore: update scanner state [skip ci]"
          git push
