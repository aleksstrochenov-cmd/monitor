name: Funding Watch - 1 minute polling on 5 minute schedule

on:
  schedule:
    # GitHub native cron minimum is 5 minutes; avoid :00 load spike.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

# Separate from scanner.yml: no edits to the existing scanner workflow.
permissions:
  contents: read

concurrency:
  group: funding-watch-read-only
  cancel-in-progress: false

jobs:
  scan_funding:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FW_STATE_DIR: state/funding_watch
      FW_HORIZON_HOURS: "8"
      FW_NOTIONAL_EACH_USD: "100"
      FW_THRESHOLD_8H_PCT: "0.05"
      # Funding rate time basis is not verified from official docs.
      # IMPORTANT: leave UNKNOWN until validated against real settlements.
      FW_VARIATIONAL_RATE_BASIS: "unknown"
      FW_SAMPLE_SECONDS: "600"
      FW_REJECTED_LOG_SECONDS: "300"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for independent funding watcher
        run: python -m pip install -r requirements-funding-watch.txt

      - name: Restore alert deduplication state from previous runs
        uses: actions/cache/restore@v4
        with:
          path: state/funding_watch/alert_state.json
          key: funding-watch-alerts-${{ github.run_id }}
          restore-keys: |
            funding-watch-alerts-

      - name: Scan five times at approximately one-minute intervals
        run: python -m funding_watch.runner --cycles 5 --poll-seconds 60

      # The cache is immutable: a new key each run. Restore prefix selects
      # newest prior entry on the default branch; separate concurrency
      # group prevents concurrent watcher runs.
      - name: Save alert state for the next scheduled run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/funding_watch/alert_state.json
          key: funding-watch-alerts-${{ github.run_id }}

      # Each run retains its own raw API samples, rejected candidates, health,
      # and opportunity events without pushing massive logs to the main branch.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-watch-logs-${{ github.run_id }}
          path: state/funding_watch/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
