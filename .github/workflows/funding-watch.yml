
name: Funding Watch - every 5 minutes

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce GitHub queue delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funding-watch-read-only
  cancel-in-progress: false

jobs:
  scan_funding:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FW_STATE_DIR: state/funding_watch
      FW_HORIZON_HOURS: "8"
      FW_NOTIONAL_EACH_USD: "100"
      FW_THRESHOLD_8H_PCT: "0.05"
      # Keep Variational excluded from signals until its funding time basis is verified.
      FW_VARIATIONAL_RATE_BASIS: "unknown"
      FW_SAMPLE_SECONDS: "300"
      FW_REJECTED_LOG_SECONDS: "300"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Funding Watch dependencies
        run: python -m pip install -r requirements-funding-watch.txt

      - name: Restore alert deduplication state
        uses: actions/cache/restore@v4
        with:
          path: state/funding_watch/alert_state.json
          key: funding-watch-alerts-${{ github.run_id }}
          restore-keys: |
            funding-watch-alerts-

      - name: Run one funding scan
        run: python -m funding_watch.runner --once

      - name: Save alert state for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/funding_watch/alert_state.json
          key: funding-watch-alerts-${{ github.run_id }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-watch-logs-${{ github.run_id }}
          path: state/funding_watch/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 6
