name: Test OKX Funding API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-okx:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compare US and Global OKX funding
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          BASES = {
              "US": "https://us.okx.com",
              "GLOBAL": "https://www.okx.com",
          }

          PAIRS = [
              "BTC-USDT-SWAP",
              "ETH-USDT-SWAP",
              "SOL-USDT-SWAP",
              "XRP-USDT-SWAP",
              "DOGE-USDT-SWAP",
          ]

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 GitHub-Actions-OKX-Test",
                      "Accept": "application/json",
                  }
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  return e.code, {"error": body}
              except Exception as e:
                  return None, {"error": str(e)}

          def fmt_time(ms):
              if not ms:
                  return "-"
              try:
                  dt = datetime.fromtimestamp(int(ms) / 1000, tz=timezone.utc)
                  return dt.strftime("%Y-%m-%d %H:%M:%S UTC")
              except Exception:
                  return str(ms)

          results = {}

          print("=" * 90)
          print("OKX FUNDING API TEST")
          print("=" * 90)

          for pair in PAIRS:
              results[pair] = {}

              print(f"\n### {pair}")

              for region, base in BASES.items():
                  url = f"{base}/api/v5/public/funding-rate?instId={pair}"

                  status, payload = request_json(url)

                  print(f"\n[{region}]")
                  print("URL:", url)
                  print("HTTP:", status)

                  if status != 200:
                      print("ERROR:", payload)
                      results[pair][region] = None
                      continue

                  if payload.get("code") != "0":
                      print("OKX API ERROR:", payload)
                      results[pair][region] = None
                      continue

                  data = payload.get("data", [])

                  if not data:
                      print("No funding data")
                      results[pair][region] = None
                      continue

                  row = data[0]

                  result = {
                      "fundingRate": row.get("fundingRate"),
                      "settFundingRate": row.get("settFundingRate"),
                      "fundingTime": row.get("fundingTime"),
                      "nextFundingTime": row.get("nextFundingTime"),
                  }

                  results[pair][region] = result

                  print("fundingRate:     ", result["fundingRate"])
                  print("settFundingRate: ", result["settFundingRate"])
                  print("fundingTime:     ", fmt_time(result["fundingTime"]))
                  print("nextFundingTime: ", fmt_time(result["nextFundingTime"]))

              us = results[pair].get("US")
              global_ = results[pair].get("GLOBAL")

              print("\nCOMPARISON:")

              if us is None:
                  print("❌ US endpoint unavailable for this pair")
              elif global_ is None:
                  print("⚠️ Global endpoint unavailable")
              else:
                  same_rate = us["fundingRate"] == global_["fundingRate"]
                  same_time = us["fundingTime"] == global_["fundingTime"]

                  print("Funding rate equal:", same_rate)
                  print("Funding time equal:", same_time)

                  if same_rate and same_time:
                      print("✅ US and GLOBAL return the same current funding data")
                  else:
                      print("⚠️ US and GLOBAL funding differ")

          print("\n" + "=" * 90)
          print("SUMMARY")
          print("=" * 90)

          for pair, regions in results.items():
              us = regions.get("US")
              global_ = regions.get("GLOBAL")

              if us and global_:
                  same = (
                      us["fundingRate"] == global_["fundingRate"]
                      and us["fundingTime"] == global_["fundingTime"]
                  )

                  print(
                      f"{pair}: "
                      f"US={us['fundingRate']} "
                      f"GLOBAL={global_['fundingRate']} "
                      f"MATCH={same}"
                  )
              else:
                  print(f"{pair}: comparison unavailable")

          PY
